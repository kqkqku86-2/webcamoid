name: Windows 7 MSYS2 Build

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
       include:
         - target_arch: x86_64
           pkg_prefix: mingw-w64-x86_64
           compiler: gcc
           upload: 1
    env:
      TARGET_ARCH: ${{ matrix.target_arch }}
      COMPILER: ${{ matrix.compiler }}
      UPLOAD: ${{ matrix.upload }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 9.1.1
        submodules: true
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          ccache
          cmake
          git
          make
          ninja
          pkgconf
          python3
          unzip
          ${{ matrix.pkg_prefix }}-ccache
          ${{ matrix.pkg_prefix }}-gcc
          ${{ matrix.pkg_prefix }}-cmake
          ${{ matrix.pkg_prefix }}-ffmpeg
          ${{ matrix.pkg_prefix }}-ninja
          ${{ matrix.pkg_prefix }}-pkgconf
          ${{ matrix.pkg_prefix }}-portaudio
          ${{ matrix.pkg_prefix }}-qt5-declarative
          ${{ matrix.pkg_prefix }}-qt5-multimedia
          ${{ matrix.pkg_prefix }}-qt5-quickcontrols2
          ${{ matrix.pkg_prefix }}-qt5-svg
          ${{ matrix.pkg_prefix }}-qt5-tools
    - name: Install dependencies
      run: ./ports/ci/windows-msys/install_deps.sh
    - name: Release Build
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      run: ./ports/ci/windows-msys/build.sh
    - name: Release Deploy
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      run: ./ports/ci/windows-msys/deploy.sh
    - name: Daily Build
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      env:
        DAILY_BUILD: 1
      run: ./ports/ci/windows-msys/build.sh
    - name: Daily Deploy
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      env:
        DAILY_BUILD: 1
      run: ./ports/ci/windows-msys/deploy.sh
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: webcamoid-win7-${{ matrix.target_arch }}
        path: webcamoid-packages/windows/*
        if-no-files-found: error
