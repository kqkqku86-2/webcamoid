name: Windows 7 MSYS2 Build

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      TARGET_ARCH: x86_64
      COMPILER: gcc
      UPLOAD: 1
      QT_VERSION: 5.15.2
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 9.1.1
        submodules: true
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          ccache
          cmake
          git
          make
          ninja
          pkgconf
          python3
          python3-pip
          unzip
          mingw-w64-x86_64-ccache
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ffmpeg
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-portaudio
    - name: Install Qt 5.15.2 via aqtinstall
      shell: pwsh
      run: |
        python -m pip install aqtinstall
        python -m aqt install-qt windows desktop 5.15.2 win64_mingw81 -O C:\Qt
        echo "C:\Qt\5.15.2\mingw81_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "QTDIR=C:\Qt\5.15.2\mingw81_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "CMAKE_PREFIX_PATH=C:\Qt\5.15.2\mingw81_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Install dependencies
      run: ./ports/ci/windows-msys/install_deps.sh
    - name: Daily Build
      env:
        DAILY_BUILD: 1
      run: ./ports/ci/windows-msys/build.sh
    - name: Daily Deploy
      env:
        DAILY_BUILD: 1
      run: ./ports/ci/windows-msys/deploy.sh
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: webcamoid-win7-x86_64
        path: webcamoid-packages/windows/*
        if-no-files-found: error
